<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>QuickNotes</title>
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>QuickNotes</h1>
            <P>Capture ideas before they disappear.</P>
            <nav>
                <a href="index.html">Home</a>
                About</a>
            </nav>
        </header>

        <main>
            <section>
                <h2>Add a note</h2>
                <form id="note-form">
                    <label for="note-input">New note</label>
                    <input type="text" id="note-input" placeholder="Enter a note">
                    <button type="submit">Add Note</button>
                </form>
            </section>

            <section>
                <h2>Your notes</h2>
                <p id="note-count"></p>
                <ul id="notes-list"></ul>
            </section>
        </main>

        <footer>
            <p>andcopy; 2026 QuickNotes. Built during Web Foundations.</p>
        </footer>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>QuickNotes</h1>

    <button id="load-btn">Load Notes</button>

    <p id="status"></p>

    <form id="note-form">
        <div>
            <label for="title-input">Title</label>
            <input id="title-input" type="text" maxlength="100" required>
        </div>

        <div>
            <label for="body-input">Body</label>
            <textarea id="body-input"></textarea>
        </div>

        <button id="submit-btn" type="submit">
            Create Note
        </button>
    </form>

    <ul id="notes-list"></ul>

    <script src="api.js" defer></script>

</body>
</html>

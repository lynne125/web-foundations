<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>QuickNotes</h1>

        <nav>
            <a href="index.html">Home</a>
            About</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Add a Note</h2>

            <form id="note-form">
                <label for="note-input">New Note</label>
                <input
                    type="text"
                    id="note-input"
                    placeholder="Type a note"
                >
                <button type="submit">Add Note</button>
            </form>
        </section>

        <section>
            <h2>Your Notes</h2>

            <p>You have 2 notes</p>

            <ul>
                <li>Revise HTML forms</li>
                <li>Push my code to GitHub</li>
            </ul>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 QuickNotes</p>
    </footer>

</body>
</html>
